<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAX-YKGW — Access</title>
<style>
  :root {
    --pink: #E91E63;
    --pink-dark: #C2185B;
    --black: #1a1a1a;
    --gray-100: #f8f9fa;
    --gray-300: #dee2e6;
    --gray-600: #6c757d;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--gray-100);
    color: var(--black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .header-bar {
    background: var(--black);
    border-radius: 8px 8px 0 0;
    padding: 18px 24px;
    margin: -48px -40px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 12px 12px 0 0;
  }
  .header-bar .title { color: var(--white); font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
  .header-bar .badge {
    background: var(--pink); color: var(--white);
    font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--gray-600); margin-bottom: 28px; }
  label {
    display: block; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--gray-600); margin-bottom: 8px;
  }
  input[type="email"] {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 2px solid var(--gray-300); border-radius: 8px;
    outline: none; transition: border-color .2s;
    font-family: inherit;
  }
  input[type="email"]:focus { border-color: var(--pink); }
  button {
    width: 100%; margin-top: 16px; padding: 14px;
    background: var(--pink); color: var(--white);
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  button:hover { background: var(--pink-dark); }
  button:active { transform: scale(0.99); }
  .error {
    margin-top: 12px; padding: 10px 14px;
    background: #fce4ec; border: 1px solid #f48fb1;
    border-radius: 6px; font-size: 13px; color: #b71c1c;
    display: none;
  }
  .error.show { display: block; }
  .footer { margin-top: 24px; font-size: 12px; color: var(--gray-600); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="header-bar">
    <span class="title">BAX × YKGW Agenda</span>
    <span class="badge">Restricted</span>
  </div>
  <h2>Enter your email</h2>
  <p class="sub">Access is restricted to invited participants only.</p>
  <form method="POST" action="/api/login">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="name@company.com" required autocomplete="email" autofocus>
    <div class="error" id="errorMsg">
      This email is not authorized. Contact the meeting organizer.
    </div>
    <button type="submit">Access agenda →</button>
  </form>
  <p class="footer">Leadership Meeting &amp; Working Sessions · Japan 2026</p>
</div>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('errorMsg').classList.add('show')
  }
</script>
</body>
</html>
